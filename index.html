<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#003f3d" />
    <title>تدشين جائزة الأمير فيصل بن بندر للتميز والإبداع</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="launch-screen" data-state="idle">
      <div class="banner-watermark" aria-hidden="true"></div>

      <section class="brand" aria-label="هوية الجائزة">
        <div class="motif" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p>حفل تكريم الفائزين</p>
        <h1>جائزة الأمير فيصل بن بندر بن عبدالعزيز</h1>
        <h2>للتميز والإبداع في دورتها الرابعة</h2>
      </section>

      <section class="activation" aria-live="polite">
        <button class="palm-pad" id="palmPad" type="button" aria-label="منطقة تفعيل التدشين">
          <span class="halo halo-one"></span>
          <span class="halo halo-two"></span>
          <span class="scan-line"></span>
          <span class="touch-glow"></span>
          <svg class="fingerprint-lines" viewBox="0 0 140 180" aria-hidden="true">
            <path d="M70 20c31 0 54 24 54 57 0 25-8 45-23 61" />
            <path d="M70 32c24 0 42 19 42 46 0 24-8 43-24 57" />
            <path d="M70 45c17 0 30 13 30 33 0 22-8 39-24 51" />
            <path d="M70 58c11 0 18 8 18 20 0 18-7 32-20 42" />
            <path d="M70 73c4 0 6 3 6 7 0 15-6 27-18 36" />
            <path d="M55 24c-24 7-39 28-39 55 0 25 8 46 24 63" />
            <path d="M50 39c-14 8-23 23-23 41 0 23 8 42 24 56" />
            <path d="M50 56c-7 6-11 14-11 25 0 20 8 37 23 49" />
            <path d="M52 75c0 15 6 28 18 39" />
            <path d="M34 150c10 9 22 14 36 14 14 0 27-5 38-15" />
            <path d="M18 136c13 24 31 36 52 36" />
          </svg>
          <span class="progress-ring" aria-hidden="true"></span>
          <span class="progress-text" id="progressText">جاهز</span>
        </button>

        <div class="status-line" id="statusLine">بتشريف سموكم يبدأ التدشين</div>
      </section>

      <section class="reveal" aria-live="assertive">
        <div class="burst"></div>
        <div class="seal">تم التدشين</div>
        <h1>جائزة الأمير فيصل بن بندر بن عبدالعزيز<br />للتميز والإبداع</h1>
        <p>في دورتها الخامسة</p>
      </section>

      <button class="reset" id="resetButton" type="button" aria-label="إعادة التجربة">إعادة</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
